    <script>
        const content = {
            en: "The very first lines already define the whole track: 'I looked in the mirror today And seen the realest person I ever met in my life.' A powerful reflection. Wiz and Juicy J — a rather unexpected collab — but the Memphis mad-style representative fit perfectly into Wiz's chill vibe. You're left with a clear head after listening. This track, the fifteenth from 2012's O.N.I.F.C., sees Wiz Khalifa and Juicy J discuss the unexpected but fulfilling natures of their respective rises to fame. Wiz raps about all that he has achieved despite doubters telling him that he couldn't, and their subsequent jealous hate. Juicy J talks about his crazy lifestyle but how it still goes hand-in-hand with thug realness.",
            es: "Ya los primeros versos definen todo el tema: 'I looked in the mirror today And seen the realest person I ever met in my life.' Una reflexión poderosa. Wiz y Juicy J — una colaboración bastante inesperada — pero el representante del estilo loco de Memphis encajó perfectamente con el rollo relajado de Wiz. Terminas con la mente despejada después de escucharlo. Esta canción, la número quince del álbum O.N.I.F.C. de 2012, muestra a Wiz Khalifa y Juicy J hablando sobre lo inesperado pero gratificante que ha sido su camino hacia la fama. Wiz rapea sobre todo lo que ha logrado a pesar de los que dudaban de él y cómo ahora sienten envidia. Juicy J habla de su estilo de vida loco, pero cómo todavía mantiene su autenticidad callejera.",
            pl: "Juz pierwsze wersy definiuja cały utwór: 'I looked in the mirror today And seen the realest person I ever met in my life.' Mocna rozkmina. Wiz i Juicy J, kolabo, dość niespodziewane, jednak do chill'u Wiza, reprezentant chorego stylu z Memphis wpasował się idealnie. Luźna głowa po odsłuchu. Ten utwór, piętnasty z albumu O.N.I.F.C. z 2012 roku, ukazuje jak Wiz Khalifa i Juicy J opowiadają o nieoczekiwanym, ale satysfakcjonującym przebiegu ich drogi do sławy. Wiz rapuje o wszystkim, co osiągnął, mimo że inni wątpili w jego możliwości i później zaczęli mu zazdrościć. Juicy J opowiada o swoim szalonym stylu życia, który mimo wszystko wciąż idzie w parze z uliczną autentycznością."
        };
        let currentLanguage = localStorage.getItem('language') || 'en';
        document.getElementById('article-content').innerHTML = '<p>' + content[currentLanguage] + '</p>';
        document.getElementById('lang-' + currentLanguage).classList.add('active');
        function setLanguage(lang) { localStorage.setItem('language', lang); location.reload(); }

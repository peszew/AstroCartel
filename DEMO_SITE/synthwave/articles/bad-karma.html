<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <link rel="stylesheet" href="article-styles.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --neon-cyan: #00ffff;
            --neon-magenta: #ff00ff;
            --neon-green: #00fa9a;
            --neon-yellow: #fce817;
            --bg-black: #1a0b2e;
            --box-bg: #2b1055;
        }

        body {
            background: var(--bg-black);
            background-image: url('https://web.archive.org/web/20071113053944if_/http://www.geocities.com/farid_fery2000/STARS-BG.gif');
            background-size: 400px;
            color: #cccccc;
            font-family: 'Courier New', Consolas, monospace;
            font-size: 14px;
            line-height: 1.7;
            min-height: 100vh;
        }

        header {
            background: linear-gradient(135deg, #4a0e4e 0%, #1a0b2e 100%);
            border-bottom: 3px double var(--neon-cyan);
            padding: 20px;
            text-align: center;
            box-shadow: 0 0 20px rgba(0, 255, 255, 0.3);
        }

        h1 {
            font-size: clamp(24px, 6vw, 36px);
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 3px;
            color: var(--neon-cyan);
            text-shadow: 0 0 10px var(--neon-cyan), 0 0 20px var(--neon-cyan);
            margin-bottom: 4px;
        }

        h1 small {
            display: block;
            font-size: 0.5em;
            color: var(--neon-yellow);
            margin-top: 8px;
        }

        nav {
            background: var(--box-bg);
            border: 2px dashed var(--neon-magenta);
            margin: 20px;
            padding: 15px;
            display: flex;
            justify-content: center;
            gap: 20px;
            flex-wrap: wrap;
        }

        nav a {
            color: var(--neon-yellow);
            text-decoration: none;
            text-transform: uppercase;
            font-weight: bold;
            letter-spacing: 1px;
            padding: 8px 16px;
            border: 1px solid var(--neon-yellow);
            transition: all 0.3s ease;
        }

        nav a:hover {
            background: var(--neon-yellow);
            color: var(--bg-black);
            box-shadow: 0 0 15px var(--neon-yellow);
        }

        .container {
            max-width: 700px;
            margin: 0 auto;
            padding: 20px;
        }

        .article-header {
            background: var(--box-bg);
            border: 2px double var(--neon-cyan);
            padding: 20px;
            margin-bottom: 30px;
        }

        .article-image {
            width: 100%;
            max-width: 400px;
            aspect-ratio: 1;
            object-fit: cover;
            border: 2px solid var(--neon-yellow);
            margin: 0 auto 20px;
            display: block;
        }

        .article-meta {
            display: flex;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 10px;
            font-size: 12px;
            color: var(--neon-green);
            border-top: 1px dashed var(--neon-cyan);
            border-bottom: 1px dashed var(--neon-cyan);
            padding: 12px 0;
            margin: 15px 0;
        }

        .article-content {
            background: var(--box-bg);
            border: 2px double var(--neon-magenta);
            padding: 25px;
            margin-bottom: 30px;
        }

        .article-content p {
            margin-bottom: 15px;
            line-height: 1.8;
        }

        .listen-btn {
            display: inline-block;
            background: var(--neon-green);
            color: var(--bg-black);
            padding: 14px 28px;
            border: none;
            text-decoration: none;
            text-transform: uppercase;
            font-weight: bold;
            font-size: 13px;
            letter-spacing: 1px;
            transition: all 0.3s ease;
            box-shadow: 0 0 15px var(--neon-green);
        }

        .listen-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 0 25px var(--neon-green);
        }

        .back-link {
            text-align: center;
            margin: 30px 0;
        }

        .back-link a {
            color: var(--neon-magenta);
            text-decoration: none;
            text-transform: uppercase;
            font-weight: bold;
            letter-spacing: 1px;
        }

        .back-link a:hover {
            text-shadow: 0 0 10px var(--neon-magenta);
        }

        .lang-switcher {
            text-align: center;
            padding: 10px;
            background: var(--box-bg);
            border: 2px solid var(--neon-cyan);
            margin: 20px;
        }

        .lang-switcher button {
            background: transparent;
            border: 2px solid var(--neon-yellow);
            color: var(--neon-yellow);
            padding: 5px 15px;
            margin: 0 5px;
            cursor: pointer;
            font-family: 'Courier New';
            text-transform: uppercase;
            font-weight: bold;
        }

        .lang-switcher button.active {
            background: var(--neon-yellow);
            color: var(--bg-black);
        }
    </style>
</head>

<body>
    <header>
        <h1>Bad Karma<small>by Axel Thesleff</small></h1>
    </header>
    <nav>
        <a href="../index.html">HOME</a>

    <div class="lang-switcher">
        <span style="color:var(--neon-green); font-size:11px; margin-right:10px;">LANGUAGE:</span>
        <button onclick="setLanguage('en')" id="lang-en">EN</button>
        <button onclick="setLanguage('es')" id="lang-es">ES</button>
        <button onclick="setLanguage('pl')" id="lang-pl">PL</button>
    </div>
    <div class="container">
        <div class="article-header">
            <img src="https://i.imgur.com/22tseLe.png" alt="Bad Karma" class="article-image">
            <div class="article-meta">
                <span>Published: 2025-04-01</span>
                <span>★★★★★</span>
            </div>
        </div>
        <div class="article-content" id="article-content"></div>
        <div style="text-align:center; margin:30px 0;">
            <a href="https://soundcloud.com/axelthesleff/bad-karma" target="_blank" class="listen-btn">▶ LISTEN NOW</a>
        </div>
        <div class="back-link">
            <a href="../index.html">← Back to All Reviews</a>
        </div>
    </div>
    <script>
        const content = {
            en: "Bonus article for April Fools' Day! When I was writing this article about the track, I had no idea about the background behind it. The track itself – a classic. Everyone has heard that characteristic mumbling and the deep bass coming in underneath at some point. It's been playing on my speakers from time to time since 2017. One of those tracks you forget about, and then it randomly comes back one day. Interestingly, it's the backstory that makes it even more fascinating. The producer Axel didn't earn anything from it! The sample was taken from some free-to-use beat pack, and the vocal is also a sample from Shamur – Let The Music Play, which actually sparked a bit of controversy. Anyway, I encourage you to listen to both tracks. Cheers!",
            es: "¡Artículo extra por el Día de los Inocentes! Cuando escribí este artículo sobre el tema, no tenía ni idea del trasfondo que había detrás. El tema en sí – un clásico. Todo el mundo ha escuchado alguna vez ese característico murmullo y el bajo profundo entrando por debajo. Suena en mis altavoces de vez en cuando desde 2017. Es una de esas canciones que se te olvidan y un día vuelven por casualidad. Lo curioso es precisamente lo que hay detrás de esta canción. ¡El productor Axel no ganó nada con ella! El sample fue tomado de un paquete de beats gratuitos, y la voz también es un sample de Shamur – Let The Music Play, lo cual generó algo de polémica. De todas formas, te invito a escuchar ambos temas. ¡Saludos!",
            pl: "Bonusowy artykuł w Prima Aprilis! Pisząc artykuł o tej nucie, w ogóle nie znałem background'u jaki za nią stoi. Sama nuta - klasyk. Każdy kiedyś usłyszał ten charakterystyczny bełkot i wjeżdżający pod niego głęboki basssss. Na głosnikach lata od czasu do czasu od 2017. Jedna z tych nutek, o której się zapomina i czasem kiedyś przypadkiem wróci. Co ciekawe właśnie z zaplecza tej nuty. Sam producent Axel, nie zarobił na niej nic! Sampel jest wzięty z jakiejś paczki beatów free to use, natomiast głos, to również sampel z Shamur - Let The Music Play, o który była lekka afera. W każdym razie zapraszam do odsłuchu jednego i drugiego utworu. Pozdro!"
        };
        let currentLanguage = localStorage.getItem('language') || 'en';
        document.getElementById('article-content').innerHTML = '<p>' + content[currentLanguage] + '</p>';
        document.getElementById('lang-' + currentLanguage).classList.add('active');
        function setLanguage(lang) { localStorage.setItem('language', lang); location.reload(); }
    </script>
</body>

</html>

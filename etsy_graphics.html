<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Etsy Profile Graphics</title>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
    <style>
        body {
            background: #111;
            color: #fff;
            font-family: Arial, sans-serif;
            padding: 40px;
            display: flex;
            flex-direction: column;
            gap: 40px;
            align-items: center;
        }
        h2 {
            color: #0ff;
            text-align: center;
            font-family: 'Press Start 2P', cursive;
        }
        
        /* 1200x300 Banner */
        .banner {
            width: 1200px;
            height: 300px;
            background: linear-gradient(180deg, #050510 0%, #220033 100%);
            border: 4px solid #f0f;
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            box-shadow: 0 0 30px rgba(255, 0, 255, 0.4);
        }
        
        .grid {
            position: absolute;
            bottom: -50px;
            width: 100%;
            height: 150px;
            background-image: 
                linear-gradient(transparent 65%, rgba(0, 255, 255, 0.8) 66%, transparent 68%),
                linear-gradient(90deg, transparent 65%, rgba(0, 255, 255, 0.8) 66%, transparent 68%);
            background-size: 40px 40px;
            transform: perspective(200px) rotateX(60deg);
        }

        .banner h1 {
            font-family: 'Press Start 2P', cursive;
            font-size: 50px;
            color: #0ff;
            text-shadow: 4px 4px 0px #f0f;
            z-index: 2;
            margin: 0;
            letter-spacing: 5px;
        }

        .banner p {
            font-family: 'VT323', monospace;
            font-size: 30px;
            color: #ff0;
            z-index: 2;
            margin-top: 10px;
            background: rgba(0,0,0,0.5);
            padding: 5px 15px;
            border: 1px dashed #0f0;
        }

        /* 500x500 Avatar */
        .avatar {
            width: 500px;
            height: 500px;
            background: #000;
            border: 8px ridge #0f0;
            border-radius: 50%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            box-shadow: 0 0 40px rgba(0, 255, 0, 0.5);
            position: relative;
            overflow: hidden;
        }

        .avatar::before {
            content: "★";
            font-size: 250px;
            color: #f0f;
            text-shadow: 0 0 30px #0ff;
            position: absolute;
            opacity: 0.3;
        }

        .avatar-text {
            font-family: 'Press Start 2P', cursive;
            font-size: 45px;
            color: #ff0;
            text-shadow: 3px 3px #f0f;
            z-index: 2;
        }
        
        .avatar-sub {
            font-family: 'VT323', monospace;
            font-size: 35px;
            color: #0ff;
            z-index: 2;
            margin-top: 10px;
        }
    </style>
</head>
<body>

    <h2>Screenshot This Box for your Shop Banner (1200x300)</h2>
    <div class="banner">
        <div class="grid"></div>
        <h1>ASTROCARTEL</h1>
        <p>★ Custom Retro & Neocities Web Design ★</p>
    </div>

    <h2>Screenshot This Circle for your Shop Avatar (500x500)</h2>
    <div class="avatar">
        <div class="avatar-text">AC</div>
        <div class="avatar-sub">WEB DESIGN</div>
    </div>

</body>
</html>

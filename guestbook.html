<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Guestbook | AstroCartel</title>
    <meta name="description" content="Sign the AstroCartel guestbook and leave your vibes">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --neon-cyan: #00ffff;
            --neon-magenta: #ff00ff;
            --neon-green: #00ff00;
            --neon-yellow: #ffff00;
            --bg-black: #000000;
            --box-bg: #0a0a0a;
        }

        body {
            background: var(--bg-black);
            background-image: url('https://web.archive.org/web/20071113053944if_/http://www.geocities.com/farid_fery2000/STARS-BG.gif');
            background-size: 400px;
            color: #cccccc;
            font-family: 'Courier New', Consolas, monospace;
            font-size: 14px;
            line-height: 1.7;
            min-height: 100vh;
        }

        header {
            background: linear-gradient(135deg, #0a0033 0%, #1a001a 100%);
            border-bottom: 3px double var(--neon-cyan);
            padding: 20px;
            text-align: center;
            box-shadow: 0 0 20px rgba(0, 255, 255, 0.3);
        }

        h1 {
            font-size: clamp(28px, 8vw, 48px);
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 4px;
            color: var(--neon-cyan);
            text-shadow:
                0 0 10px var(--neon-cyan),
                0 0 20px var(--neon-cyan),
                0 0 30px var(--neon-magenta);
            margin-bottom: 8px;
        }

        nav {
            background: var(--box-bg);
            border: 2px dashed var(--neon-magenta);
            margin: 20px;
            padding: 15px;
            display: flex;
            justify-content: center;
            gap: 20px;
            flex-wrap: wrap;
        }

        nav a {
            color: var(--neon-yellow);
            text-decoration: none;
            text-transform: uppercase;
            font-weight: bold;
            letter-spacing: 1px;
            padding: 8px 16px;
            border: 1px solid var(--neon-yellow);
            transition: all 0.3s ease;
        }

        nav a:hover {
            background: var(--neon-yellow);
            color: var(--bg-black);
            box-shadow: 0 0 15px var(--neon-yellow);
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
        }

        .guestbook-intro {
            background: var(--box-bg);
            border: 2px double var(--neon-green);
            padding: 25px;
            margin-bottom: 30px;
            text-align: center;
        }

        .guestbook-intro h2 {
            color: var(--neon-green);
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 15px;
            font-size: 18px;
        }

        .form-container {
            background: var(--box-bg);
            border: 2px double var(--neon-cyan);
            padding: 30px;
            margin-bottom: 30px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            color: var(--neon-yellow);
            text-transform: uppercase;
            font-size: 12px;
            margin-bottom: 8px;
            letter-spacing: 1px;
        }

        input,
        textarea {
            width: 100%;
            background: var(--bg-black);
            border: 2px solid var(--neon-cyan);
            color: var(--neon-green);
            padding: 12px;
            font-family: 'Courier New', monospace;
            font-size: 14px;
        }

        input:focus,
        textarea:focus {
            outline: none;
            border-color: var(--neon-magenta);
            box-shadow: 0 0 10px rgba(255, 0, 255, 0.3);
        }

        textarea {
            min-height: 120px;
            resize: vertical;
        }

        .submit-btn {
            background: var(--neon-magenta);
            color: var(--bg-black);
            border: none;
            padding: 14px 32px;
            text-transform: uppercase;
            font-weight: bold;
            font-size: 13px;
            letter-spacing: 1px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 0 15px rgba(255, 0, 255, 0.4);
            width: 100%;
        }

        .submit-btn:hover {
            box-shadow: 0 0 25px rgba(255, 0, 255, 0.6);
            transform: translateY(-2px);
        }

        .submit-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .status-message {
            padding: 15px;
            margin-bottom: 20px;
            text-align: center;
            display: none;
            border: 2px solid;
        }

        .status-message.success {
            background: rgba(0, 255, 0, 0.1);
            border-color: var(--neon-green);
            color: var(--neon-green);
        }

        .status-message.error {
            background: rgba(255, 0, 0, 0.1);
            border-color: #ff0000;
            color: #ff0000;
        }

        .entries-container {
            background: var(--box-bg);
            border: 2px double var(--neon-green);
            padding: 30px;
            margin-top: 30px;
        }

        .entries-container h2 {
            color: var(--neon-green);
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 25px;
            font-size: 18px;
            text-align: center;
        }

        .entry {
            background: rgba(0, 255, 255, 0.05);
            border-left: 4px solid var(--neon-cyan);
            padding: 20px;
            margin-bottom: 20px;
            transition: all 0.3s ease;
        }

        .entry:hover {
            border-left-color: var(--neon-magenta);
            box-shadow: 0 0 15px rgba(255, 0, 255, 0.2);
        }

        .entry-header {
            color: var(--neon-yellow);
            font-weight: bold;
            font-size: 16px;
            margin-bottom: 8px;
        }

        .entry-date {
            color: var(--neon-cyan);
            font-size: 11px;
            margin-bottom: 12px;
            text-transform: uppercase;
        }

        .entry-message {
            color: #cccccc;
            line-height: 1.6;
        }

        .no-entries {
            text-align: center;
            color: var(--neon-magenta);
            padding: 40px 20px;
            font-style: italic;
        }
    </style>
</head>

<body>
    <header>
        <h1>GUESTBOOK</h1>
    </header>

    <nav>
        <a href="index.html">HOME</a>
        <a href="guestbook.html">GUESTBOOK</a>
        <a href="about.html">ABOUT</a>
    </nav>

    <div class="container">
        <div class="guestbook-intro">
            <h2>✦ Sign the Guestbook ✦</h2>
            <p>
                Leave your vibes, thoughts, or just say hi! <br>
                All messages are welcome. Let me know what you think about the reviews or music in general.
            </p>
        </div>

        <div class="status-message" id="statusMessage"></div>

        <div class="form-container">
            <form id="guestbookForm">
                <div class="form-group">
                    <label for="name">Name / Nickname *</label>
                    <input type="text" id="name" name="name" required maxlength="50" placeholder="Your nickname">
                </div>

                <div class="form-group">
                    <label for="email">Email (optional)</label>
                    <input type="email" id="email" name="email" maxlength="100" placeholder="your@email.com">
                </div>

                <div class="form-group">
                    <label for="message">Message *</label>
                    <textarea id="message" name="message" required maxlength="500"
                        placeholder="Leave your vibes here..."></textarea>
                </div>

                <button type="submit" class="submit-btn" id="submitBtn">Sign Guestbook</button>
            </form>
        </div>

        <!-- Public Entries Display -->
        <div class="entries-container">
            <h2>✦ Recent Entries ✦</h2>
            <div id="entries">
                <div class="no-entries">Loading entries...</div>
            </div>
        </div>
    </div>

    <script>
        // REPLACE THIS with your Google Apps Script Web App URL
        const GOOGLE_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbwsSN1BTqMc63zadRm9v9xkYZY0jX9ETKJpEiuvve9PF69cXVANBXHfFPucEZxtSiJtDQ/exec';

        // Load and display guestbook entries from Google Sheets
        async function loadEntries() {
            try {
                const response = await fetch(GOOGLE_SCRIPT_URL);
                const entries = await response.json();
                const container = document.getElementById('entries');

                if (!entries || entries.length === 0) {
                    container.innerHTML = '<div class="no-entries">No entries yet. Be the first to sign!</div>';
                    return;
                }

                container.innerHTML = entries.map(entry => {
                    const date = new Date(entry.timestamp);
                    const formattedDate = date.toLocaleDateString('en-US', {
                        year: 'numeric',
                        month: 'short',
                        day: 'numeric'
                    });

                    return `
                        <div class="entry">
                            <div class="entry-header">${escapeHtml(entry.name)}</div>
                            <div class="entry-date">${formattedDate}</div>
                            <div class="entry-message">${escapeHtml(entry.message)}</div>
                        </div>
                    `;
                }).join('');
            } catch (error) {
                console.error('Error loading entries:', error);
                document.getElementById('entries').innerHTML =
                    '<div class="no-entries">No entries yet. Be the first to sign!</div>';
            }
        }

        // Escape HTML to prevent XSS
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // Form submission to Google Sheets
        const form = document.getElementById('guestbookForm');
        const statusMessage = document.getElementById('statusMessage');
        const submitBtn = document.getElementById('submitBtn');

        form.addEventListener('submit', async function (e) {
            e.preventDefault();

            submitBtn.disabled = true;
            submitBtn.textContent = 'Sending...';

            const formData = new FormData(form);
            const params = new URLSearchParams(formData);

            try {
                const response = await fetch(GOOGLE_SCRIPT_URL + '?' + params.toString(), {
                    method: 'POST',
                });

                const result = await response.json();

                if (result.result === 'success') {
                    statusMessage.className = 'status-message success';
                    statusMessage.textContent = '✓ Thanks for signing! Your entry will appear shortly.';
                    statusMessage.style.display = 'block';
                    form.reset();

                    // Reload entries after 2 seconds
                    setTimeout(() => {
                        loadEntries();
                        statusMessage.style.display = 'none';
                    }, 2000);
                } else {
                    throw new Error(result.message || 'Submission failed');
                }
            } catch (error) {
                console.error('Error:', error);
                statusMessage.className = 'status-message error';
                statusMessage.textContent = '✗ Oops! Something went wrong. Please try again.';
                statusMessage.style.display = 'block';
            } finally {
                submitBtn.disabled = false;
                submitBtn.textContent = 'Sign Guestbook';
            }
        });

        // Load entries on page load
        loadEntries();

        // Auto-refresh entries every 30 seconds
        setInterval(loadEntries, 30000);
    </script>
</body>

</html>
